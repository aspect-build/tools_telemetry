name: CI - Aspect Workflows

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    id-token: write

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

env:
    # Indicates where the aspect CLI should look for .aspect/config.json
    ASPECT_WORKSPACE: ${{ github.workspace }}
    # Skip the --remote flag on fork PRs, which do not have access to secrets
    REMOTE_FLAG: ${{ secrets.ASPECT_OSS_API_TOKEN != '' && '--remote' || '' }}

jobs:
    test:
        name: test (${{ matrix.workspace.path }}, ${{ matrix.bazel.id }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                workspace:
                - { path: ".", slug: "root" }
                - { path: "examples/simple", slug: "examples-simple" }
                bazel:
                - { id: "bazel-7", version: "7.x", flags: "" }
                - { id: "bazel-8", version: "8.x", flags: "" }
                - { id: "bazel-9", version: "9.x", flags: "" }
        env:
            USE_BAZEL_VERSION: ${{ matrix.bazel.version }}
        steps:
            - uses: actions/checkout@v6
            - uses: aspect-build/setup-aspect@b1e9d142e86f63c10d603304daa22bf80492e24c # v2026.25.1
              with:
                aspect-api-token: ${{ secrets.ASPECT_OSS_API_TOKEN }}
            - name: Test
              working-directory: ${{ matrix.workspace.path }}
              run: aspect test $REMOTE_FLAG --task:name=test-${{ matrix.workspace.slug }}-${{ matrix.bazel.id }} ${{ matrix.bazel.flags }} -- //...

    notice_once:
        name: notice_once (notice-once, bazel-9)
        runs-on: ubuntu-latest
        env:
            USE_BAZEL_VERSION: "9.x"
        steps:
            - uses: actions/checkout@v6
            - uses: aspect-build/setup-aspect@b1e9d142e86f63c10d603304daa22bf80492e24c # v2026.25.1
              with:
                aspect-api-token: ${{ secrets.ASPECT_OSS_API_TOKEN }}
            - name: notice-once integration test
              run: bash examples/notice_once/test.sh

    missing_lockfile:
        name: missing_lockfile (missing-lockfile, bazel-9)
        runs-on: ubuntu-latest
        env:
            USE_BAZEL_VERSION: "9.x"
        steps:
            - uses: actions/checkout@v6
            - uses: aspect-build/setup-aspect@b1e9d142e86f63c10d603304daa22bf80492e24c # v2026.25.1
              with:
                aspect-api-token: ${{ secrets.ASPECT_OSS_API_TOKEN }}
            - name: missing-lockfile integration test
              run: bash examples/missing_lockfile/test.sh
